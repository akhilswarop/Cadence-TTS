<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadence TTS — word-synced reader</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#101218">
<style>
  /* Dark by default, unconditionally — not "follows system preference",
     which would still show light on a light-mode system. A system light
     preference no longer has any effect; :root[data-theme="light"] is kept
     as a hook for a future manual toggle, since nothing sets it today. */
  :root {
    --bg: #101218;
    --paper: #181b23;
    --line: #262a35;
    --text: #e9ebf2;
    --muted: #838a9c;
    --accent: #6b83ff;
    --accent-ink: #0b0d14;
    --sentence: #262a4d;
    --word: #4a44a8;
    --word-ink: #f2f0ff;
    --spoken: #5d6475;
    --chip: #1f2430;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.45), 0 16px 40px rgba(0,0,0,.35);
  }
  :root[data-theme="light"] {
    --bg: #eef0f6;
    --paper: #ffffff;
    --line: #e2e5ee;
    --text: #191b22;
    --muted: #838a9c;
    --accent: #2f4bf0;
    --accent-ink: #ffffff;
    --sentence: #e8e6fd;
    --word: #c3bcf9;
    --word-ink: #1a1440;
    --spoken: #9aa0b0;
    --chip: #f3f4f9;
    --shadow-sm: 0 1px 2px rgba(20,25,50,.06);
    --shadow-lg: 0 4px 12px rgba(20,25,50,.08), 0 16px 40px rgba(20,25,50,.10);
  }

  * { box-sizing: border-box; }

  /* Mobile WebKit/Blink paint a solid highlight rectangle over whatever was
     tapped, on top of any hover/active styling this app already defines
     for that element — it is not something .ic:hover etc. can override.
     :focus-visible below still gives keyboard users a real focus ring. */
  * { -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .hidden { display: none !important; }

  /* ---------------------------- top bar ---------------------------- */

  /* Android 15+ draws apps edge to edge, so content lands underneath the
     status bar, the punch-hole camera and the gesture bar unless it is
     inset deliberately. The native shell overwrites these at runtime with
     the real measurements; env() covers the browser and PWA cases. */
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    /* Safe-area padding is asymmetric on purpose — extra room for the
       status bar/cutout on top, none needed on the bottom — which is
       exactly why it lives here and not on .topbar-row below: putting it
       on the row would shift that row's own vertical centre away from
       where its content actually sits. */
    padding-top: var(--safe-top);
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  /* The row's padding is symmetric (10px top and bottom alike), so its
     geometric centre and its flex content's visual centre are the same
     point — which .tb-mid's absolute centring below depends on. */
  .topbar-row {
    position: relative;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    padding: 10px calc(16px + var(--safe-right)) 10px calc(16px + var(--safe-left));
  }
  /* Centred on the row itself, not on the space left between the two
     button clusters — the desktop icon row is far wider than the single
     folder icon opposite it, so centring within the leftover middle track
     visibly drifted toward the light side. pointer-events: none because
     the title is a label, not a control, so it never intercepts a click
     meant for whatever it may visually overlap at very narrow widths. */
  .tb-mid {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    max-width: min(60vw, 420px);
    pointer-events: none;
  }
  .tb-left, .tb-right {
    display: flex; align-items: center; gap: 4px; min-width: 0;
  }
  /* min-width: 0 is required — flex items default to min-width: auto, so
     the voice select would refuse to shrink below the width of its longest
     option name and push the whole page into horizontal scroll. */
  .tb-right { justify-content: flex-end; }

  .tb-title {
    display: block; width: 100%;
    font-size: 15px; font-weight: 700; letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-align: center;
  }

  .ic {
    appearance: none; border: 0; background: transparent;
    color: var(--muted); cursor: pointer;
    width: 34px; height: 34px; border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center;
    font: inherit; font-size: 13px; font-weight: 600;
    transition: background .12s, color .12s;
  }
  .ic:hover { background: var(--chip); color: var(--text); }
  .ic[aria-pressed="true"] { color: var(--accent); background: var(--chip); }
  .ic svg { display: block; }
  .ic:focus-visible, .play-btn:focus-visible, .speed:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  #tools { display: flex; align-items: center; gap: 4px; min-width: 0; }
  #btnMore { display: none; }

  select#voice, select#chapterSelect {
    font: inherit; font-size: 12px;
    color: var(--muted); background: var(--chip);
    border: 1px solid transparent; border-radius: 9px;
    padding: 6px 8px; max-width: 168px; min-width: 0; cursor: pointer;
  }
  select#voice:hover, select#chapterSelect:hover { color: var(--text); }

  /* ----------------------------- paper ----------------------------- */

  /* One measure shared by the reading panel and the editor, so switching
     between them doesn't shift the layout. Wide enough to actually use the
     screen; capped because past roughly 85 characters a line the eye loses
     its place on the return sweep. Tune --measure to taste. */
  :root { --measure: clamp(900px, 72vw, 1000px); }

  main { padding: 24px clamp(12px, 3vw, 28px) 190px; }

  .paper {
    max-width: var(--measure); margin: 0 auto;
    background: var(--paper);
    border-radius: 16px;
    box-shadow: var(--shadow-sm);
    padding: clamp(30px, 4.5vw, 52px) clamp(22px, 4vw, 60px) clamp(38px, 5vw, 64px);
  }

  #reader {
    font-family: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: var(--reader-size, 20px);
    line-height: 1.95;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .empty-notice {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; font-style: italic; color: var(--muted);
    text-align: center; margin: 2em 0 0;
  }

  /* Two highlight levels: a soft band marking the sentence being spoken,
     and a saturated mark on the exact word. The band gives the eye a place
     to land when it looks away and back; the word carries the position. */
  /* Rendered Markdown. pre-wrap is right for plain text but would preserve
     the source's own line breaks inside a paragraph, so it is dropped once
     real block elements are doing the wrapping. */
  #reader.rich { white-space: normal; }
  #reader.rich > *:first-child { margin-top: 0; }
  #reader.rich p { margin: 0 0 1.05em; }
  #reader.rich h1, #reader.rich h2, #reader.rich h3,
  #reader.rich h4, #reader.rich h5, #reader.rich h6 {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.3; letter-spacing: -.015em;
    margin: 1.7em 0 .6em;
  }
  #reader.rich h1 { font-size: 1.55em; }
  #reader.rich h2 { font-size: 1.3em; }
  #reader.rich h3 { font-size: 1.12em; }
  #reader.rich h4, #reader.rich h5, #reader.rich h6 { font-size: 1em; }
  #reader.rich ul, #reader.rich ol { margin: 0 0 1.05em; padding-left: 1.5em; }
  #reader.rich li { margin: .3em 0; }
  #reader.rich li input[type=checkbox] { margin-right: .5em; accent-color: var(--accent); }
  #reader.rich blockquote {
    margin: 0 0 1.05em; padding: .1em 0 .1em 1.1em;
    border-left: 3px solid var(--word); color: var(--muted);
  }
  #reader.rich blockquote p:last-child { margin-bottom: 0; }
  #reader.rich a { color: var(--accent); text-underline-offset: 2px; }
  #reader.rich code {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: .85em; background: var(--chip);
    padding: .12em .38em; border-radius: 5px;
  }
  #reader.rich pre {
    background: var(--chip); border-radius: 10px;
    padding: 14px 16px; margin: 0 0 1.05em;
    overflow-x: auto; font-size: .78em; line-height: 1.6;
  }
  #reader.rich pre code { background: none; padding: 0; font-size: 1em; }
  #reader.rich img {
    display: block; max-width: 100%; height: auto;
    border-radius: 10px; margin: 1.2em 0;
  }
  #reader.rich hr { border: 0; border-top: 1px solid var(--line); margin: 1.8em 0; }
  /* Wide tables scroll inside their own box rather than the page. */
  #reader.rich table {
    display: block; width: 100%; overflow-x: auto;
    border-collapse: collapse; margin: 0 0 1.05em; font-size: .84em;
  }
  #reader.rich th, #reader.rich td {
    border: 1px solid var(--line); padding: 7px 11px;
    text-align: left; vertical-align: top;
  }
  #reader.rich th { background: var(--chip); font-weight: 600; }

  .w { cursor: pointer; padding: 2px 0; border-radius: 3px; }

  /* Words are separate spans, so a plain background leaves the spaces
     between them unpainted and the band comes out striped. The shoulders
     below bleed each word's colour into the gap on either side, which
     costs no layout because box-shadow doesn't reflow. */
  .w.sentence {
    background: var(--sentence);
    box-shadow: -0.3em 0 0 var(--sentence), 0.3em 0 0 var(--sentence);
  }
  /* Already-spoken words deliberately keep full contrast — dimming them
     makes a long document look washed out as you read. The class is still
     applied, so restoring a progress tint is a one-line change:
       .w.spoken:not(.sentence) { color: var(--spoken); }  */
  .w.active {
    background: var(--word);
    color: var(--word-ink);
    border-radius: 4px;
    box-shadow: -0.16em 0 0 var(--word), 0.16em 0 0 var(--word);
  }
  .w:hover:not(.active) { box-shadow: 0 0 0 2px var(--chip); background: var(--chip); }

  #editor {
    display: block; width: 100%; min-height: 60vh;
    max-width: var(--measure); margin: 0 auto;
    padding: clamp(18px, 3vw, 28px);
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 13px; line-height: 1.7;
    border: 1px solid var(--line); border-radius: 14px;
    background: var(--paper); color: var(--text);
    resize: vertical; box-shadow: var(--shadow-sm);
  }

  .banner {
    max-width: 720px; margin: 0 auto 18px;
    padding: 12px 16px; border-radius: 10px;
    background: var(--sentence); color: var(--text);
    font-size: 13px;
  }

  /* ---------------------------- player ----------------------------- */

  .player {
    position: fixed; z-index: 30;
    left: 50%; bottom: calc(26px + var(--safe-bottom)); transform: translateX(-50%);
    width: min(520px, calc(100vw - 32px));
    background: var(--paper);
    border-radius: 18px;
    box-shadow: var(--shadow-lg);
    padding: 14px 18px 16px;
  }

  .p-bar {
    height: 4px; border-radius: 3px;
    background: var(--line); overflow: hidden; cursor: pointer;
  }
  #progressFill {
    height: 100%; width: 0%;
    background: var(--accent); border-radius: 3px;
    transition: width .18s linear;
  }
  .p-times {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--muted);
    margin-top: 7px; font-variant-numeric: tabular-nums;
  }

  /* The transport is centred on its own. The dial is taken out of flow so
     its width can never pull the play button off centre. */
  .p-controls {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    gap: 20px; margin-top: 10px; min-height: 54px;
  }

  .play-btn {
    appearance: none; border: 0; cursor: pointer;
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 38%, transparent);
    transition: transform .1s, filter .12s;
  }
  .play-btn:hover { filter: brightness(1.07); }
  .play-btn:active { transform: scale(.94); }
  .play-btn svg { display: block; }

  /* Speed dial: a 270-degree gauge with the value in the middle. */
  .dial {
    position: absolute; right: 2px; top: 50%;
    transform: translateY(-50%);
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    cursor: ns-resize; user-select: none; touch-action: none;
    border-radius: 50%;
  }
  .dial svg { position: absolute; inset: 0; transform: rotate(135deg); }
  .dial-track {
    fill: none; stroke: var(--line); stroke-width: 3.5; stroke-linecap: round;
  }
  .dial-arc {
    fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round;
    transition: stroke-dasharray .12s ease;
  }
  .dial:hover .dial-track { stroke: color-mix(in srgb, var(--accent) 30%, var(--line)); }
  .dial:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #rateVal {
    position: relative;
    font-size: 10.5px; font-weight: 700; color: var(--text);
    font-variant-numeric: tabular-nums; line-height: 1;
    pointer-events: none;
  }

  /* Only surfaces when word timing is estimated rather than reported by
     the speech engine — an idle badge saying "idle" is just clutter. */
  #timingMode {
    position: absolute; top: 11px; right: 14px;
    padding: 2px 7px; border-radius: 20px;
    background: var(--sentence); color: var(--accent);
    font-size: 9.5px; font-weight: 700; letter-spacing: .02em;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #timingMode.show { opacity: 1; }

  .p-foot {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin-top: 10px;
    font-size: 10.5px; color: var(--muted);
  }
  .pill {
    padding: 2px 8px; border-radius: 20px;
    border: 1px solid var(--line); white-space: nowrap;
  }
  .pill.warn { border-color: var(--accent); color: var(--accent); }

  /* --------------------------- overlays ---------------------------- */

  #drop {
    position: fixed; inset: 0; z-index: 100;
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0; transition: opacity .15s;
  }
  #drop.on { opacity: 1; }
  #drop div {
    padding: 38px 54px; border-radius: 16px;
    border: 2px dashed var(--accent); color: var(--accent);
    background: var(--paper); font-size: 15px; font-weight: 600;
    box-shadow: var(--shadow-lg);
  }

  #toast {
    position: fixed; z-index: 200;
    bottom: 150px; left: 50%; transform: translateX(-50%);
    padding: 9px 15px; border-radius: 10px;
    background: var(--text); color: var(--bg);
    font-size: 12.5px; font-weight: 500;
    opacity: 0; pointer-events: none; transition: opacity .2s;
    box-shadow: var(--shadow-lg);
  }
  #toast.on { opacity: 1; }

  /* On a phone the sheet metaphor just wastes the width the text needs, so
     the panel goes full-bleed: no gutters, no radius, no shadow, and tall
     enough to cover the screen even when the document is short. */
  /* Nine controls plus two selects never fit across a phone, so below this
     width the secondary ones collapse into a sheet behind the overflow
     button and pick up text labels, which a 34px icon cannot carry alone.
     1100px rather than a phone-only breakpoint: with the chapter select
     added alongside the voice select, the inline cluster can reach ~600px
     wide, which on anything narrower makes the cluster's own left edge
     fall before the bar's true centre — no amount of repositioning the
     title fixes that, the cluster itself has to shrink first. */
  @media (max-width: 1100px) {
    #btnMore { display: inline-flex; }

    #tools {
      display: none;
      position: fixed;
      top: calc(var(--safe-top) + 54px);
      right: calc(10px + var(--safe-right));
      flex-direction: column; align-items: stretch; gap: 2px;
      min-width: 208px; padding: 6px;
      background: var(--paper);
      border: 1px solid var(--line); border-radius: 14px;
      box-shadow: var(--shadow-lg);
      z-index: 40;
    }
    #tools.open { display: flex; }
    #tools .ic {
      width: 100%; height: 42px;
      justify-content: flex-start; gap: 11px; padding: 0 11px;
      border-radius: 9px;
    }
    #tools .ic::after {
      content: attr(data-label);
      font-size: 13.5px; font-weight: 500; color: var(--text);
    }
    #tools .ic[aria-pressed="true"]::after { color: var(--accent); }
    #tools select#voice, #tools select#chapterSelect {
      width: 100%; max-width: none; height: 40px; margin-top: 2px;
    }
  }

  @media (max-width: 640px) {
    main { padding: 0 0 190px; }
    .paper {
      max-width: none;
      border-radius: 0;
      box-shadow: none;
      padding: 22px 20px 40px;
      min-height: calc(100vh - 58px);
      min-height: calc(100dvh - 58px);
    }
    #editor {
      max-width: none;
      border-radius: 0;
      border-left: 0; border-right: 0;
      min-height: 70vh;
    }
    .tb-mid { max-width: 52vw; }
  }
</style>

<header class="topbar">
 <div class="topbar-row">
  <div class="tb-left">
    <button class="ic" id="btnOpen" data-label="Open file" title="Open a file" aria-label="Open a file">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v7a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 3 17z"/></svg>
    </button>
    <input type="file" id="fileInput" class="hidden" accept=".txt,.md,.markdown,.text,.pdf,.epub,text/plain,application/pdf,application/epub+zip">
  </div>

  <div class="tb-mid">
    <div class="tb-title" id="source">Cadence TTS</div>
  </div>

  <div class="tb-right">
    <!-- One container, two layouts: an inline row on a wide screen, a
         popover sheet behind the overflow button on a narrow one. Same
         elements either way, so no control is duplicated. -->
    <div id="tools">
      <button class="ic" id="btnPaste" data-label="Paste" title="Paste from clipboard" aria-label="Paste from clipboard">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="4" width="10" height="16" rx="2"/><path d="M10 4V3h4v1"/></svg>
      </button>
      <button class="ic" id="btnEdit" data-label="Edit text" title="Edit text" aria-label="Edit text">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/></svg>
      </button>
      <button class="ic" id="btnStop" data-label="Stop" title="Stop" aria-label="Stop">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
      </button>
      <button class="ic" id="btnFont" data-label="Text size" title="Text size" aria-label="Text size">Aa</button>
      <button class="ic" id="btnClean" data-label="Render formatting" title="Render Markdown formatting" aria-label="Render formatting" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M5 12h9M5 17h6"/><path d="m15.5 16.5 2 2 4-4.5"/></svg>
      </button>
      <button class="ic" id="btnFollow" data-label="Follow along" title="Follow the spoken word" aria-label="Follow the spoken word" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
      </button>
      <select id="chapterSelect" class="hidden" title="Chapter" aria-label="Chapter"></select>
      <select id="voice" title="Voice" aria-label="Voice"></select>
    </div>

    <button class="ic" id="btnMore" title="More controls" aria-label="More controls" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>

    <input type="checkbox" id="clean" class="hidden" checked>
    <input type="checkbox" id="autoscroll" class="hidden" checked>
    <input type="range" id="rate" class="hidden" min="0.5" max="5" step="any" value="1">
  </div>
 </div>
</header>

<main>
  <div id="unsupported" class="banner hidden">
    This browser doesn't expose the Web Speech API, so playback is unavailable.
    Chrome, Edge, and Safari support it.
  </div>
  <textarea id="editor" class="hidden" spellcheck="false"></textarea>
  <article class="paper"><div id="reader"></div></article>
</main>

<div class="player">
  <div class="p-bar" id="seekBar" title="Jump to a position"><div id="progressFill"></div></div>
  <div class="p-times"><span id="tElapsed">0:00</span><span id="tTotal">0:00</span></div>

  <div class="p-controls">
    <button class="ic" id="btnBack" title="Back one sentence" aria-label="Back one sentence">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M11.5 12 18 7.4v9.2zM5 12l6.5-4.6v9.2z"/></svg>
    </button>

    <button class="play-btn" id="btnPlay" title="Play (Space)" aria-label="Play">
      <svg id="iconPlay" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8.5 5.6v12.8a1 1 0 0 0 1.52.86l10.2-6.4a1 1 0 0 0 0-1.72L10.02 4.74A1 1 0 0 0 8.5 5.6z" fill="currentColor"/></svg>
      <svg id="iconPause" class="hidden" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="7" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg>
    </button>

    <button class="ic" id="btnFwd" title="Forward one sentence" aria-label="Forward one sentence">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12.5 12 6 16.6V7.4zM19 12l-6.5 4.6V7.4z"/></svg>
    </button>

    <div class="dial" id="speedDial" role="slider" tabindex="0"
         aria-label="Playback speed" aria-valuemin="0" aria-valuemax="9" aria-valuenow="1"
         title="Speed &mdash; drag, scroll, or tap">
      <svg viewBox="0 0 40 40" width="42" height="42" aria-hidden="true">
        <circle class="dial-track" cx="20" cy="20" r="16"/>
        <circle class="dial-arc" id="dialArc" cx="20" cy="20" r="16"/>
      </svg>
      <span id="rateVal">1&#215;</span>
    </div>

    <input type="range" id="speedSlider" class="hidden" min="0" max="9" step="1" value="1">
  </div>

  <span id="timingMode">estimated timing</span>
</div>

<div id="drop"><div>Drop a .txt, .md, .pdf, or .epub file to read it</div></div>
<div id="toast"></div>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 * 1. TOKENIZER
 *
 * Splits text into words while preserving exact character offsets into
 * the ORIGINAL string. Those offsets are the contract with the TTS
 * engine: `onboundary` reports a charIndex, and we translate it back to
 * a token through these offsets. If they drift, the highlight drifts.
 * ------------------------------------------------------------------ */

// A word is a run of letters (allowing internal apostrophes and hyphens,
// so "don't" and "well-known" stay single tokens), or a run of digits
// with internal separators so "1,234.56" doesn't fragment.
const WORD_RE = /[\p{L}\p{M}]+(?:['’\-][\p{L}\p{M}]+)*|\p{N}+(?:[.,]\p{N}+)*/gu;

function tokenize(text) {
  const tokens = [];
  let m;
  WORD_RE.lastIndex = 0;
  while ((m = WORD_RE.exec(text)) !== null) {
    tokens.push({
      index: tokens.length,
      text: m[0],
      start: m.index,
      end: m.index + m[0].length,
    });
  }
  return tokens;
}

/** Largest token index whose start is <= charPos. Binary search. */
function tokenAtChar(tokens, charPos) {
  let lo = 0, hi = tokens.length - 1, best = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (tokens[mid].start <= charPos) { best = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  return best;
}

/* ------------------------------------------------------------------ *
 * 2. CHUNKER
 *
 * Long utterances are unreliable — Chrome in particular stops speaking
 * after roughly 15 seconds. Splitting at sentence boundaries avoids that
 * and gives natural pause points for seeking.
 *
 * Every chunk carries `charOffset`, its absolute position in the source.
 * The engine reports offsets relative to the chunk; adding charOffset is
 * what keeps highlighting aligned across the whole document.
 * ------------------------------------------------------------------ */

function chunkText(text, maxLen = 220) {
  // Sentence-ish: run of non-terminators, terminators, optional closers.
  const SENTENCE_RE = /[^.!?\n]*(?:[.!?]+['")\]”’]*|\n+|$)/gy;
  const chunks = [];
  let buffer = "", bufferStart = 0, pos = 0;

  SENTENCE_RE.lastIndex = 0;
  while (pos < text.length) {
    SENTENCE_RE.lastIndex = pos;
    const m = SENTENCE_RE.exec(text);
    if (!m || m[0].length === 0) { pos++; continue; }
    const sentence = m[0];
    pos += sentence.length;

    if (buffer && buffer.length + sentence.length > maxLen) {
      chunks.push({ text: buffer, charOffset: bufferStart });
      buffer = sentence;
      bufferStart = pos - sentence.length;
    } else {
      if (!buffer) bufferStart = pos - sentence.length;
      buffer += sentence;
    }

    // A single sentence longer than maxLen*1.6 gets forced apart so we
    // never hand the engine an oversized utterance — real prose sentences
    // routinely run past 350 characters, so this triggers often enough to
    // matter, not just on pathological input. Cutting at the last comma,
    // semicolon, colon, or dash lands the break on a point the writer
    // already marked as a natural pause; only when a sentence runs long
    // with no such mark at all does this fall back to the last space, and
    // then to a bare maxLen cut.
    while (buffer.length > maxLen * 1.6) {
      let cut = Math.max(
        buffer.lastIndexOf(", ", maxLen), buffer.lastIndexOf("; ", maxLen),
        buffer.lastIndexOf(": ", maxLen), buffer.lastIndexOf("— ", maxLen)
      );
      if (cut > 0) cut += 1;               // keep the punctuation with the chunk that ends there
      else cut = buffer.lastIndexOf(" ", maxLen);
      if (cut <= 0) cut = maxLen;
      chunks.push({ text: buffer.slice(0, cut), charOffset: bufferStart });
      bufferStart += cut;
      buffer = buffer.slice(cut);
    }
  }
  if (buffer.trim()) chunks.push({ text: buffer, charOffset: bufferStart });
  return chunks.filter(c => c.text.trim().length > 0);
}

/* ------------------------------------------------------------------ *
 * 2b. SENTENCES
 *
 * Distinct from chunks. A chunk is a unit of speech, sized to keep the
 * engine happy, and may hold several sentences. The highlight band is a
 * reading aid, so it follows real sentence boundaries instead — otherwise
 * it stretches across a paragraph break and stops meaning anything.
 * ------------------------------------------------------------------ */

function buildSentences(text, tokens) {
  const bounds = [0];
  const RE = /[.!?]+['")\]]*(?=\s|$)|\n{2,}/g;
  let m;
  while ((m = RE.exec(text)) !== null) bounds.push(m.index + m[0].length);
  bounds.push(text.length);

  const edges = [...new Set(bounds)].sort((a, b) => a - b);
  const ofToken = new Int32Array(tokens.length);
  const ranges = [];

  let s = 0;
  for (let i = 0; i < tokens.length; i++) {
    while (s < edges.length - 2 && tokens[i].start >= edges[s + 1]) s++;
    ofToken[i] = s;
    if (ranges[s]) ranges[s][1] = i;
    else ranges[s] = [i, i];
  }

  return { ofToken, ranges };
}

/* ------------------------------------------------------------------ *
 * 3. RENDERER
 *
 * Word spans with the original inter-word text preserved verbatim, so
 * the rendered document is character-identical to the source.
 * ------------------------------------------------------------------ */

class Renderer {
  constructor(el) {
    this.el = el;
    this.spans = [];
    this.active = -1;
  }

  render(text, tokens) {
    const frag = document.createDocumentFragment();
    this.spans = [];
    let cursor = 0;

    for (const tok of tokens) {
      if (tok.start > cursor) {
        frag.appendChild(document.createTextNode(text.slice(cursor, tok.start)));
      }
      const span = document.createElement("span");
      span.className = "w";
      span.dataset.i = tok.index;
      span.textContent = tok.text;
      frag.appendChild(span);
      this.spans.push(span);
      cursor = tok.end;
    }
    if (cursor < text.length) {
      frag.appendChild(document.createTextNode(text.slice(cursor)));
    }

    this.el.replaceChildren(frag);
    this.el.classList.remove("rich");
    this.active = -1;
    this._sFrom = this._sTo = null;
  }

  /** Take an already-built tree whose words buildFromDom has wrapped. */
  adopt(tree, spans) {
    this.el.replaceChildren(tree);
    this.el.classList.add("rich");
    this.spans = spans;
    this.active = -1;
    this._sFrom = this._sTo = null;
  }

  /** Appended after render/adopt when a document has no words at all —
   *  an EPUB cover or title page is the common real case. Both of those
   *  methods already call replaceChildren first, so this only ever shows
   *  up alongside whatever non-text content (an image, say) that page
   *  actually had, rather than replacing it. */
  showEmptyNotice() {
    const p = document.createElement("p");
    p.className = "empty-notice";
    p.textContent = "No readable text on this page — likely a cover, title page, or image.";
    this.el.appendChild(p);
  }

  highlight(index, { scroll = true } = {}) {
    if (index === this.active || index < 0 || index >= this.spans.length) return;

    if (this.active >= 0) {
      this.spans[this.active].classList.remove("active");
    }
    // Mark everything up to here as spoken, so progress reads at a glance
    // even after a seek backwards.
    for (let i = 0; i < this.spans.length; i++) {
      this.spans[i].classList.toggle("spoken", i < index);
    }

    const span = this.spans[index];
    span.classList.add("active");
    this.active = index;

    if (scroll) this._follow(span);
  }

  /** Only scroll when the word leaves a comfortable middle band. */
  _follow(span) {
    const r = span.getBoundingClientRect();
    const top = window.innerHeight * 0.25;
    const bottom = window.innerHeight * 0.68;
    if (r.top < top || r.bottom > bottom) {
      span.scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }

  /** Soft band over the sentence being spoken. Only the edges of the range
   *  are touched when it moves, so this stays cheap on long documents. */
  setSentence(from, to) {
    if (this._sFrom === from && this._sTo === to) return;
    if (this._sFrom != null) {
      for (let i = this._sFrom; i <= this._sTo && i < this.spans.length; i++) {
        this.spans[i].classList.remove("sentence");
      }
    }
    for (let i = from; i <= to && i < this.spans.length; i++) {
      this.spans[i].classList.add("sentence");
    }
    this._sFrom = from;
    this._sTo = to;
  }

  clear() {
    if (this.active >= 0) this.spans[this.active].classList.remove("active");
    this.spans.forEach(s => s.classList.remove("spoken", "sentence"));
    this.active = -1;
    this._sFrom = this._sTo = null;
  }
}

/* ------------------------------------------------------------------ *
 * 3b. MARKDOWN -> DOM
 *
 * Renders Markdown as real elements instead of flattening it to text, so
 * headings, emphasis, lists, tables and images survive into the reader.
 *
 * Nodes are built with createElement and textContent throughout, never
 * innerHTML, so a document cannot inject markup or script. Raw HTML in the
 * source is therefore shown as literal text rather than executed, and link
 * and image URLs are restricted to schemes that cannot run code.
 * ------------------------------------------------------------------ */

const SAFE_LINK = /^(?:https?:|mailto:)/i;
const SAFE_IMAGE = /^(?:https?:|data:image\/)/i;

function elText(tag, text) {
  const e = document.createElement(tag);
  e.textContent = text;
  return e;
}

function inlineInto(parent, text) {
  for (const node of inlineToNodes(text)) parent.appendChild(node);
  return parent;
}

function wrapInline(tag, inner) {
  return inlineInto(document.createElement(tag), inner);
}

function linkNode(label, href) {
  const a = document.createElement("a");
  if (SAFE_LINK.test(href)) {
    a.href = href;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
  }
  return inlineInto(a, label);
}

function imageNode(alt, src) {
  if (!SAFE_IMAGE.test(src)) return document.createTextNode(alt);
  const img = document.createElement("img");
  img.src = src;
  img.alt = alt;
  img.loading = "lazy";
  return img;
}

/* Ordered by precedence. Each rule matches once; the scanner below picks
   whichever rule matches earliest in the remaining text. */
const INLINE_RULES = [
  { re: /\\([\\`*_{}\[\]()#+\-.!>~|])/, make: (m) => document.createTextNode(m[1]) },
  { re: /(`+)([\s\S]*?)\1/, make: (m) => elText("code", m[2].trim()) },
  { re: /!\[([^\]]*)\]\(\s*([^)\s]+)[^)]*\)/, make: (m) => imageNode(m[1], m[2]) },
  { re: /\[([^\]]+)\]\(\s*([^)\s]+)[^)]*\)/, make: (m) => linkNode(m[1], m[2]) },
  { re: /<((?:https?|mailto):[^>\s]+)>/, make: (m) => linkNode(m[1], m[1]) },
  // Standard autolink syntax for an email needs no explicit "mailto:" —
  // <test@example.com> is itself the whole address, with the scheme only
  // implied — but that scheme still has to land in the actual href for it
  // to work as a link at all, so it's added here rather than left for the
  // browser to infer.
  { re: /<([^<>\s@]+@[^<>\s@]+\.[^<>\s@]+)>/, make: (m) => linkNode(m[1], "mailto:" + m[1]) },
  {
    re: /(\*\*\*|___)(\S(?:[\s\S]*?\S)?)\1/,
    make: (m) => {
      const strong = document.createElement("strong");
      strong.appendChild(wrapInline("em", m[2]));
      return strong;
    },
  },
  { re: /(\*\*|__)(\S(?:[\s\S]*?\S)?)\1/, make: (m) => wrapInline("strong", m[2]) },
  { re: /~~([\s\S]+?)~~/, make: (m) => wrapInline("del", m[1]) },
  { re: /\*(\S(?:[^*\n]*?\S)?)\*/, make: (m) => wrapInline("em", m[1]) },
  {
    // Underscore emphasis only at word boundaries, so snake_case survives.
    re: /(^|[^A-Za-z0-9_])_(\S(?:[^_\n]*?\S)?)_(?![A-Za-z0-9])/,
    make: (m) => {
      const frag = document.createDocumentFragment();
      if (m[1]) frag.appendChild(document.createTextNode(m[1]));
      frag.appendChild(wrapInline("em", m[2]));
      return frag;
    },
  },
];

function inlineToNodes(text) {
  const out = [];
  let rest = String(text);
  let guard = 0;

  while (rest && guard++ < 10000) {
    let best = null;
    for (const rule of INLINE_RULES) {
      const m = rule.re.exec(rest);
      if (m && (!best || m.index < best.m.index)) best = { m, rule };
    }
    if (!best) break;

    if (best.m.index > 0) out.push(document.createTextNode(rest.slice(0, best.m.index)));
    out.push(best.rule.make(best.m));
    rest = rest.slice(best.m.index + best.m[0].length);
  }

  if (rest) out.push(document.createTextNode(rest));
  return out;
}

const LIST_ITEM = /^([ \t]*)([-*+]|\d+[.)])[ \t]+(.*)$/;

function markdownToDom(src) {
  const root = document.createElement("div");
  const lines = String(src).replace(/\r\n?/g, "\n").split("\n");
  const blank = (s) => !s || !s.trim();
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];
    if (blank(line)) { i++; continue; }

    const fence = line.match(/^[ \t]*(```|~~~)/);
    if (fence) {
      const marker = fence[1];
      const body = [];
      i++;
      while (i < lines.length && !lines[i].trimStart().startsWith(marker)) body.push(lines[i++]);
      i++;                                   // step past the closing fence
      const pre = document.createElement("pre");
      pre.appendChild(elText("code", body.join("\n")));
      root.appendChild(pre);
      continue;
    }

    if (/^ {0,3}([-*_])[ \t]*(?:\1[ \t]*){2,}$/.test(line)) {
      root.appendChild(document.createElement("hr"));
      i++; continue;
    }

    const atx = line.match(/^ {0,3}(#{1,6})\s+(.*?)\s*#*\s*$/);
    if (atx) {
      root.appendChild(wrapInline("h" + atx[1].length, atx[2]));
      i++; continue;
    }

    const next = lines[i + 1];
    if (next && /^ {0,3}=+\s*$/.test(next)) {
      root.appendChild(wrapInline("h1", line.trim())); i += 2; continue;
    }
    if (next && /^ {0,3}-+\s*$/.test(next) && !LIST_ITEM.test(line)) {
      root.appendChild(wrapInline("h2", line.trim())); i += 2; continue;
    }

    if (/^ {0,3}>/.test(line)) {
      const body = [];
      while (i < lines.length && /^ {0,3}>/.test(lines[i])) {
        body.push(lines[i].replace(/^ {0,3}> ?/, ""));
        i++;
      }
      const quote = document.createElement("blockquote");
      quote.appendChild(markdownToDom(body.join("\n")));
      root.appendChild(quote);
      continue;
    }

    // A leading and trailing pipe is optional in GFM — "Name | Age" is as
    // valid a header row as "| Name | Age |" — so requiring both, as this
    // used to, missed every table written in the no-edge-pipes style.
    const isRow = (s) => s.includes("|");
    const isSeparator = (s) =>
      /^[ \t]*\|?[ \t]*:?-{2,}:?[ \t]*(\|[ \t]*:?-{2,}:?[ \t]*)*\|?[ \t]*$/.test(s);
    const isTableStart = (idx) =>
      isRow(lines[idx]) && lines[idx + 1] !== undefined && isSeparator(lines[idx + 1]);

    if (isTableStart(i)) {
      const cells = (s) => s.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const table = document.createElement("table");
      const head = document.createElement("tr");
      for (const c of cells(line)) head.appendChild(wrapInline("th", c));
      const thead = document.createElement("thead");
      thead.appendChild(head);
      table.appendChild(thead);

      i += 2;
      const tbody = document.createElement("tbody");
      while (i < lines.length && isRow(lines[i])) {
        const tr = document.createElement("tr");
        for (const c of cells(lines[i])) tr.appendChild(wrapInline("td", c));
        tbody.appendChild(tr);
        i++;
      }
      table.appendChild(tbody);
      root.appendChild(table);
      continue;
    }

    const item = line.match(LIST_ITEM);
    if (item) {
      // A sibling item must sit at this same indent; anything indented
      // deeper — a nested list, or just a continuation line — belongs to
      // this item's own content instead of ending it. Without tracking
      // indent, an indented sub-list looked like "a list of the other kind"
      // and fractured the parent list around it: a numbered list containing
      // a nested bullet sub-list used to split into two separate <ol>s with
      // an unrelated <ul> sandwiched between them, and since a fresh <ol>
      // always starts counting at 1, the second fragment's numbering was
      // simply wrong.
      const indent = item[1].length;
      const ordered = /\d/.test(item[2]);
      const list = document.createElement(ordered ? "ol" : "ul");

      while (i < lines.length) {
        const m = lines[i].match(LIST_ITEM);
        if (!m || m[1].length !== indent || /\d/.test(m[2]) !== ordered) break;

        const itemLines = [m[3]];
        i++;
        while (i < lines.length && !blank(lines[i])) {
          const cm = lines[i].match(LIST_ITEM);
          if (cm && cm[1].length <= indent) break;
          itemLines.push(lines[i]);
          i++;
        }

        const li = document.createElement("li");
        let content = itemLines.join("\n");

        const task = content.match(/^\[([ xX])\][ \t]+([\s\S]*)$/);
        if (task) {
          const box = document.createElement("input");
          box.type = "checkbox";
          box.disabled = true;
          box.checked = /[xX]/.test(task[1]);
          li.appendChild(box);
          content = task[2];
        }

        // Recursed rather than inlined as one run of text, so a nested list
        // or a second wrapped paragraph inside this item goes through the
        // same block-level rules as the top level instead of being
        // flattened into it. The item's own label always starts as a <p> —
        // that first paragraph is unwrapped either way, so a marker (a
        // checkbox, say) still sits inline with its label instead of being
        // pushed onto its own line by a block-level wrapper; only further
        // content after it (a nested list) stays as real block children.
        const body = markdownToDom(content);
        if (body.firstElementChild && body.firstElementChild.tagName === "P") {
          const label = body.firstElementChild;
          while (label.firstChild) li.appendChild(label.firstChild);
          label.remove();
        }
        while (body.firstChild) li.appendChild(body.firstChild);
        list.appendChild(li);

        // A blank line between items is still one list, so look past it.
        let peek = i;
        while (peek < lines.length && blank(lines[peek])) peek++;
        if (peek < lines.length) {
          const pm = lines[peek].match(LIST_ITEM);
          if (pm && pm[1].length === indent) { i = peek; continue; }
        }
        break;
      }

      root.appendChild(list);
      continue;
    }

    const para = [];
    while (i < lines.length && !blank(lines[i]) &&
           !/^ {0,3}(#{1,6}\s|>|```|~~~)/.test(lines[i]) && !LIST_ITEM.test(lines[i]) &&
           !isTableStart(i)) {
      para.push(lines[i]);
      i++;
    }
    if (para.length) root.appendChild(wrapInline("p", para.join("\n")));
    else i++;
  }

  return root;
}

/* ------------------------------------------------------------------ *
 * 3c. DOM -> WORD SPANS + SPOKEN TEXT
 *
 * One walk produces both halves at once: the rendered tree gets its words
 * wrapped in spans, and the string that will actually be spoken is
 * accumulated alongside. Token offsets index into that string, so the
 * timing track works exactly as it does for plain text and nothing
 * downstream can tell the difference.
 * ------------------------------------------------------------------ */

const BLOCK_TAGS = new Set([
  "P","H1","H2","H3","H4","H5","H6","LI","BLOCKQUOTE",
  "TR","TABLE","UL","OL","HR","PRE","DIV","FIGCAPTION",
]);

// Code blocks are displayed but not read aloud; source read as prose is
// unpleasant and it would dominate the timing of a technical document.
const UNSPOKEN_TAGS = new Set(["PRE"]);

// Cells need a pause between them or a row is spoken as one run-on word
// ("Col ACol B"), but a paragraph break between every cell is too much.
const CELL_TAGS = new Set(["TD", "TH"]);

function buildFromDom(root) {
  const tokens = [];
  const spans = [];
  let spoken = "";

  const endBlock = () => {
    // Drop a trailing space left by a whitespace-only sibling text node
    // (indentation before a closing tag, say) before deciding whether a
    // break is needed — otherwise that space sits between the real content
    // and the \n\n, and survives untouched by the check below.
    spoken = spoken.replace(/[ \t]+$/, "");
    if (spoken && !spoken.endsWith("\n\n")) spoken += "\n\n";
  };

  function walk(node) {
    if (node.nodeType === Node.TEXT_NODE) {
      // Collapse internal whitespace runs to a single space, the same way
      // CSS white-space: normal already renders this text visually. Without
      // this, a source line-wrap inside one paragraph's text node — routine
      // in hand-formatted EPUBs and multi-line Markdown paragraphs alike —
      // survives into the spoken string as a literal newline. The chunker
      // treats any \n as a sentence boundary, so that single stray newline
      // becomes a chunk split, and each chunk is its own TTS utterance: the
      // engine adds a full-stop pause at a point with no actual punctuation.
      let text = node.nodeValue.replace(/\s+/g, " ");
      if (!text) return;

      // A text node that is nothing but formatting whitespace — the
      // indentation between two sibling block tags in pretty-printed XHTML,
      // extremely common in hand-formatted EPUBs — carries no words, so it
      // never needs its own span. What it must not do is leak a literal
      // space into the spoken text right at a paragraph boundary. Appending
      // at most one space, and only when spoken doesn't already end in
      // whitespace, keeps a genuine inline gap (a bold span followed by a
      // word) while dropping the block-boundary case entirely.
      if (!node.nodeValue.trim()) {
        if (spoken && !/\s$/.test(spoken)) spoken += " ";
        return;
      }

      // The other half of the same rule, for a node that is NOT pure
      // whitespace: its own leading indentation is still real whitespace
      // and still collapses to a leading space above — e.g. "<p>\n  Alice
      // was…" — and if this is the first content of a fresh block, that
      // leading space would land directly after the "\n\n" just inserted.
      // Only strip it in that position; a leading space here otherwise is
      // a genuine inline gap after a preceding sibling.
      if (spoken.endsWith("\n\n") && text.startsWith(" ")) text = text.slice(1);

      const base = spoken.length;
      const frag = document.createDocumentFragment();
      let cursor = 0;
      let m;

      WORD_RE.lastIndex = 0;
      while ((m = WORD_RE.exec(text)) !== null) {
        if (m.index > cursor) {
          frag.appendChild(document.createTextNode(text.slice(cursor, m.index)));
        }
        const span = document.createElement("span");
        span.className = "w";
        span.dataset.i = String(tokens.length);
        span.textContent = m[0];
        tokens.push({
          index: tokens.length,
          text: m[0],
          start: base + m.index,
          end: base + m.index + m[0].length,
        });
        spans.push(span);
        frag.appendChild(span);
        cursor = m.index + m[0].length;
      }
      if (cursor < text.length) {
        frag.appendChild(document.createTextNode(text.slice(cursor)));
      }

      node.replaceWith(frag);
      spoken += text;
      return;
    }

    if (node.nodeType !== Node.ELEMENT_NODE) return;

    if (UNSPOKEN_TAGS.has(node.tagName)) { endBlock(); return; }

    for (const kid of [...node.childNodes]) walk(kid);

    if (CELL_TAGS.has(node.tagName)) {
      if (spoken && !/[\s,]$/.test(spoken)) spoken += ", ";
    } else if (BLOCK_TAGS.has(node.tagName)) {
      endBlock();
    }
  }

  walk(root);
  return { text: spoken, tokens, spans };
}

/* ------------------------------------------------------------------ *
 * 3d. EPUB -> CHAPTERS
 *
 * An EPUB is a zip of real (X)HTML chapter files plus a manifest — much
 * closer to the Markdown case than to PDF's coordinate soup, so this
 * reuses the same DOM-in, spans-and-spoken-text-out pipeline as Markdown
 * (buildFromDom above) rather than inventing a second one. The only
 * genuinely new work is: unzip, resolve the spine/manifest into a chapter
 * list, and sanitise real third-party HTML rather than HTML generated
 * from scratch by this app's own Markdown renderer.
 *
 * That sanitisation is the part worth being careful about — this is the
 * first place in the app that parses HTML written by someone else, rather
 * than building nodes from scratch or displaying source as literal text.
 * ------------------------------------------------------------------- */

const JSZIP_URL = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
let jszipPromise = null;

/** Fetched on first EPUB only, so text/Markdown/PDF stay independent of it. */
function loadJSZip() {
  if (!jszipPromise) {
    jszipPromise = new Promise((resolve, reject) => {
      if (window.JSZip) return resolve(window.JSZip);
      const script = document.createElement("script");
      script.src = JSZIP_URL;
      script.onload = () => resolve(window.JSZip);
      script.onerror = () => reject(new Error("Failed to fetch JSZip"));
      document.head.appendChild(script);
    }).catch((err) => { jszipPromise = null; throw err; });
  }
  return jszipPromise;
}

/** Joins an href against the directory the OPF file lives in, collapsing
 *  ../ and ./ — EPUB resource paths are always relative to the OPF, not
 *  to the zip root. */
function resolveEpubPath(baseDir, href) {
  const clean = href.split("#")[0];
  const parts = (baseDir ? baseDir + "/" + clean : clean).split("/");
  const out = [];
  for (const part of parts) {
    if (part === "." || part === "") continue;
    if (part === "..") out.pop();
    else out.push(part);
  }
  return out.join("/");
}

function dirname(path) {
  const i = path.lastIndexOf("/");
  return i < 0 ? "" : path.slice(0, i);
}

/**
 * Strips everything a chapter's HTML could use to run code or break out of
 * the app's own visual language, then rewrites image references to point
 * at the blob URLs already extracted from the zip.
 *
 * Deliberately narrower than the Markdown renderer's inline sanitisation:
 * that one builds every node itself and only ever needs to constrain link
 * and image *schemes*. This one is parsing a complete third-party document,
 * so it also has to remove executable content outright (script, inline
 * event handlers, stylesheets that could hide content via CSS) and drop
 * author styling entirely — the book's fonts and colours are not carried
 * over, the same way a Markdown document's raw HTML is shown as text
 * rather than rendered. In-book links (footnotes, cross-chapter jumps) are
 * unwrapped to plain text; there is no in-app navigation target for them.
 */
function sanitizeEpubChapter(doc, resources) {
  const root = document.createElement("div");

  const DROP_TAGS = new Set([
    "SCRIPT", "STYLE", "LINK", "META", "TITLE", "BASE",
    "OBJECT", "EMBED", "IFRAME", "FORM", "INPUT", "BUTTON", "SVG",
  ]);

  function convert(node) {
    if (node.nodeType === Node.COMMENT_NODE) return null;
    if (node.nodeType === Node.TEXT_NODE) return document.createTextNode(node.nodeValue);
    if (node.nodeType !== Node.ELEMENT_NODE) return null;

    // XHTML is XML, and XML preserves source casing exactly — real EPUB
    // chapters are written in lowercase ("<p>", "<h1>"), so a chapter that
    // happens to parse cleanly under application/xhtml+xml (rather than
    // falling back to the lenient text/html parser, which does uppercase
    // everything) hands this function tagName values like "p", not "P".
    // Every comparison below normalises to uppercase for exactly that
    // reason; without it, every element here fell through to the "unknown"
    // branch and no paragraph or heading break ever fired, so a whole
    // chapter read as one unbroken run of text.
    const tagName = node.tagName.toUpperCase();
    if (DROP_TAGS.has(tagName)) return null;

    if (tagName === "IMG") {
      const src = node.getAttribute("src");
      const resolved = src && resources.get(src.replace(/^\.?\//, ""));
      if (!resolved) return null;   // no local resource to show it from
      const img = document.createElement("img");
      img.src = resolved;
      img.alt = node.getAttribute("alt") || "";
      img.loading = "lazy";
      return img;
    }

    const tag = tagName === "A" ? "a" : tagName.toLowerCase();
    const out = document.createElement(
      /^(H[1-6]|P|UL|OL|LI|BLOCKQUOTE|TABLE|THEAD|TBODY|TR|TH|TD|PRE|CODE|EM|I|STRONG|B|BR|HR|SPAN|DIV|A|SUP|SUB)$/.test(tagName)
        ? tag
        : "span"   // unknown elements keep their text but not their identity
    );

    if (tag === "a") {
      const href = node.getAttribute("href") || "";
      if (SAFE_LINK.test(href)) {
        out.href = href;
        out.target = "_blank";
        out.rel = "noopener noreferrer";
      } else {
        // An unresolvable in-book link: keep the text, drop the wrapper.
        const frag = document.createDocumentFragment();
        for (const child of node.childNodes) {
          const converted = convert(child);
          if (converted) frag.appendChild(converted);
        }
        return frag;
      }
    }

    for (const child of node.childNodes) {
      const converted = convert(child);
      if (converted) out.appendChild(converted);
    }
    return out;
  }

  const body = doc.body || doc.documentElement;
  for (const child of body.childNodes) {
    const converted = convert(child);
    if (converted) root.appendChild(converted);
  }
  return root;
}

/** Parses one chapter's HTML string into a sanitised DOM ready for
 *  buildFromDom. XHTML first (EPUB's actual format); a small share of
 *  real-world EPUBs ship HTML that isn't well-formed XML, so a parse
 *  error falls back to the lenient HTML parser rather than failing the
 *  whole chapter. */
function parseEpubChapter(html, resources) {
  let doc = new DOMParser().parseFromString(html, "application/xhtml+xml");
  if (doc.querySelector("parsererror")) {
    doc = new DOMParser().parseFromString(html, "text/html");
  }
  return sanitizeEpubChapter(doc, resources);
}

/** Reads container.xml -> the OPF package document -> manifest + spine,
 *  extracts every image as a blob URL, and returns the book ready to read
 *  chapter by chapter. Nothing here renders text yet — parseEpubChapter
 *  does that lazily per chapter, same as Markdown re-renders from source
 *  each time rather than caching a mutated tree. */
async function extractEpub(file) {
  const JSZip = await loadJSZip();
  const zip = await JSZip.loadAsync(file);

  const containerXml = await zip.file("META-INF/container.xml").async("string");
  const containerDoc = new DOMParser().parseFromString(containerXml, "application/xml");
  const opfPath = containerDoc.querySelector("rootfile").getAttribute("full-path");
  const opfDir = dirname(opfPath);

  const opfXml = await zip.file(opfPath).async("string");
  const opfDoc = new DOMParser().parseFromString(opfXml, "application/xml");

  const manifest = new Map();
  for (const item of opfDoc.querySelectorAll("manifest > item")) {
    manifest.set(item.getAttribute("id"), {
      href: resolveEpubPath(opfDir, item.getAttribute("href")),
      mediaType: item.getAttribute("media-type") || "",
    });
  }

  const title =
    opfDoc.querySelector("metadata > *[*|title], metadata > title")?.textContent?.trim() ||
    null;

  // Image resources become blob URLs up front; text chapters stay as raw
  // HTML strings and are only parsed when actually opened.
  const resources = new Map();
  for (const { href, mediaType } of manifest.values()) {
    if (!mediaType.startsWith("image/")) continue;
    const entry = zip.file(href);
    if (!entry) continue;
    const blob = await entry.async("blob");
    resources.set(href, URL.createObjectURL(new Blob([blob], { type: mediaType })));
  }

  const spineIds = [...opfDoc.querySelectorAll("spine > itemref")].map((el) =>
    el.getAttribute("idref")
  );

  const chapters = [];
  for (const id of spineIds) {
    const item = manifest.get(id);
    if (!item || !/html/.test(item.mediaType)) continue;
    const entry = zip.file(item.href);
    if (!entry) continue;
    chapters.push({ href: item.href, html: await entry.async("string"), title: null });
  }

  if (!chapters.length) {
    throw new Error("No readable chapters found in this EPUB.");
  }

  // Chapter titles come from whichever table of contents the book ships.
  // EPUB3 books declare a nav document (properties="nav"); EPUB2 books —
  // still the majority of real-world files, including most Calibre
  // conversions — use an NCX instead, referenced by the spine's toc
  // attribute rather than a manifest property. Try both; ordinal titles
  // cover whatever neither one resolves.
  const navHref = [...opfDoc.querySelectorAll("manifest > item")]
    .find((el) => el.getAttribute("properties") === "nav")
    ?.getAttribute("href");

  if (navHref) {
    try {
      const navXml = await zip.file(resolveEpubPath(opfDir, navHref)).async("string");
      const navDoc = new DOMParser().parseFromString(navXml, "application/xhtml+xml");
      const navDir = dirname(resolveEpubPath(opfDir, navHref));
      for (const a of navDoc.querySelectorAll("nav a[href]")) {
        const target = resolveEpubPath(navDir, a.getAttribute("href"));
        const chapter = chapters.find((c) => c.href === target);
        if (chapter && !chapter.title) chapter.title = a.textContent.trim();
      }
    } catch (_) {
      // No usable nav document — the NCX branch or ordinals below cover it.
    }
  }

  const tocId = opfDoc.querySelector("spine")?.getAttribute("toc");
  const ncxHref = tocId && manifest.get(tocId)?.href;
  if (ncxHref && chapters.some((c) => !c.title)) {
    try {
      const ncxXml = await zip.file(ncxHref).async("string");
      const ncxDoc = new DOMParser().parseFromString(ncxXml, "application/xml");
      const ncxDir = dirname(ncxHref);
      for (const point of ncxDoc.querySelectorAll("navPoint")) {
        const src = point.querySelector(":scope > content")?.getAttribute("src");
        const label = point.querySelector(":scope > navLabel > text")?.textContent?.trim();
        if (!src || !label) continue;
        const target = resolveEpubPath(ncxDir, src);
        const chapter = chapters.find((c) => c.href === target);
        if (chapter && !chapter.title) chapter.title = label;
      }
    } catch (_) {
      // No usable NCX either — ordinals below cover the rest.
    }
  }

  chapters.forEach((c, i) => { if (!c.title) c.title = `Chapter ${i + 1}`; });

  return { title: title || "Untitled book", resources, chapters };
}

/* ------------------------------------------------------------------ *
 * 4. ENGINE — Web Speech
 *
 * Produces a stream of absolute character positions as it speaks. This is
 * the only engine-specific code in the app; anything that emits
 * `onWord(absoluteCharIndex)` can replace it (Polly speech marks, Azure
 * wordBoundary, a forced aligner) without the UI changing.
 *
 * Two failure modes are handled explicitly:
 *   - `cancel()` fires `onend` in some browsers, which would otherwise
 *     advance the queue. A generation counter guards against that.
 *   - Chrome's network voices frequently never fire `onboundary`. If no
 *     boundary arrives shortly after a chunk starts, an estimator takes
 *     over so the highlight still moves. It is clearly labelled as
 *     estimated, because it is a guess and shouldn't be mistaken for
 *     real timing data.
 * ------------------------------------------------------------------ */

class WebSpeechEngine {
  constructor({ onWord, onStateChange, onTimingMode, onDone }) {
    this.onWord = onWord;
    this.onStateChange = onStateChange;
    this.onTimingMode = onTimingMode;
    this.onDone = onDone;

    this.synth = window.speechSynthesis;
    this.generation = 0;
    this.chunks = [];
    this.cursor = 0;
    this.rate = 1;
    this.voice = null;
    this.state = "idle";

    this._raf = null;
    this._estimateStart = 0;
    this._estimateTokens = null;
    this._pausedAt = 0;
  }

  static get available() {
    return typeof window !== "undefined" && "speechSynthesis" in window;
  }

  speak(chunks, { startIndex = 0, tokensByChunk = [] } = {}) {
    this.stop();
    this.generation++;
    this.chunks = chunks;
    this.tokensByChunk = tokensByChunk;
    this.cursor = startIndex;
    this._setState("playing");
    this._speakCurrent();
  }

  _speakCurrent() {
    const gen = this.generation;
    if (this.cursor >= this.chunks.length) {
      this._setState("idle");
      this.onDone?.();
      return;
    }

    const chunk = this.chunks[this.cursor];
    const u = new SpeechSynthesisUtterance(chunk.text);
    if (this.voice) u.voice = this.voice;
    u.rate = this.rate;

    let sawBoundary = false;

    u.onboundary = (e) => {
      if (gen !== this.generation) return;
      if (e.name && e.name !== "word") return;
      if (!sawBoundary) {
        sawBoundary = true;
        this._stopEstimator();
        this.onTimingMode?.("native");
      }
      this.onWord(chunk.charOffset + e.charIndex);
    };

    u.onstart = () => {
      if (gen !== this.generation) return;
      // Give the engine a moment to prove it emits boundaries; if it
      // doesn't, fall back rather than freezing the highlight.
      setTimeout(() => {
        if (gen !== this.generation || sawBoundary) return;
        this.onTimingMode?.("estimated");
        this._startEstimator(chunk);
      }, 700);
    };

    u.onend = () => {
      if (gen !== this.generation) return;   // guards cancel()-triggered onend
      this._stopEstimator();
      this.cursor++;
      this._speakCurrent();
    };

    u.onerror = (e) => {
      if (gen !== this.generation) return;
      if (e.error === "interrupted" || e.error === "canceled") return;
      this._stopEstimator();
      this.cursor++;
      this._speakCurrent();
    };

    this.current = u;
    this.synth.speak(u);
  }

  /* Fallback: walk the chunk's words at an estimated speaking rate.
     Roughly 2.9 words/sec at rate 1.0 for English synthetic speech. */
  _startEstimator(chunk) {
    const gen = this.generation;
    const tokens = this.tokensByChunk[this.cursor] || [];
    if (!tokens.length) return;

    const wps = 2.9 * this.rate;
    this._estimateStart = performance.now();

    const step = () => {
      if (gen !== this.generation || this.state !== "playing") return;
      const elapsed = (performance.now() - this._estimateStart) / 1000;
      const i = Math.min(tokens.length - 1, Math.floor(elapsed * wps));
      this.onWord(tokens[i].start);
      this._raf = requestAnimationFrame(step);
    };
    this._raf = requestAnimationFrame(step);
  }

  _stopEstimator() {
    if (this._raf) { cancelAnimationFrame(this._raf); this._raf = null; }
  }

  pause() {
    if (this.state !== "playing") return;
    this.synth.pause();
    this._pausedAt = performance.now();
    this._stopEstimator();
    this._setState("paused");
  }

  resume() {
    if (this.state !== "paused") return;
    // Shift the estimator's origin so paused time isn't counted as spoken.
    if (this._estimateStart) this._estimateStart += performance.now() - this._pausedAt;
    this.synth.resume();
    this._setState("playing");
    if (this._estimateStart && !this._raf) {
      this._startEstimatorResume();
    }
  }

  _startEstimatorResume() {
    const gen = this.generation;
    const tokens = this.tokensByChunk[this.cursor] || [];
    if (!tokens.length) return;
    const wps = 2.9 * this.rate;
    const step = () => {
      if (gen !== this.generation || this.state !== "playing") return;
      const elapsed = (performance.now() - this._estimateStart) / 1000;
      const i = Math.min(tokens.length - 1, Math.floor(elapsed * wps));
      this.onWord(tokens[i].start);
      this._raf = requestAnimationFrame(step);
    };
    this._raf = requestAnimationFrame(step);
  }

  stop() {
    this.generation++;              // invalidate every in-flight handler
    this._stopEstimator();
    this._estimateStart = 0;
    try { this.synth.cancel(); } catch (_) {}
    this._setState("idle");
  }

  setRate(rate) {
    this.rate = rate;
    // Web Speech ignores rate changes mid-utterance, so restart from the
    // current chunk to make the change take effect immediately.
    if (this.state === "playing") {
      const resumeAt = this.cursor;
      this.speak(this.chunks, { startIndex: resumeAt, tokensByChunk: this.tokensByChunk });
    }
  }

  _setState(s) {
    this.state = s;
    this.onStateChange?.(s);
  }
}

/* ------------------------------------------------------------------ *
 * 4b. ENGINE — Android native TTS
 *
 * Android WebView does not implement the Web Speech API, so inside the APK
 * the browser engine simply is not there. The platform's own TextToSpeech
 * is used instead, reached through the Java bridge in TtsBridge.java.
 *
 * What it gives back is better than Web Speech for this app's purposes:
 * onRangeStart reports the character range of every word, always, with no
 * estimator fallback needed.
 *
 * Two platform differences are handled here rather than leaking upward:
 *   - TextToSpeech has no pause. Pausing stops playback and remembers the
 *     position; resuming re-speaks from that word.
 *   - Rate applies per utterance, so a rate change restarts from the
 *     current word — the same behaviour the Web Speech engine has.
 * ------------------------------------------------------------------ */

class AndroidTtsEngine {
  constructor({ onWord, onStateChange, onTimingMode, onDone }) {
    this.onWord = onWord;
    this.onStateChange = onStateChange;
    this.onTimingMode = onTimingMode;
    this.onDone = onDone;

    this.native = window.AndroidTTS;
    this.chunks = [];
    this.rate = 1;
    this.voice = null;
    this.state = "idle";
    this.generation = 0;
    this._lastChar = 0;

    // Single hub the Java side calls into, routed to whichever instance
    // is current.
    window.__androidTts = {
      on: (type, payload) => this._handle(type, payload),
    };
  }

  static get available() {
    return typeof window !== "undefined" && typeof window.AndroidTTS !== "undefined";
  }

  _handle(type, payload) {
    if (type === "ready") {
      this.onReady?.(payload.ok);
      return;
    }

    if (type === "range") {
      const chunk = this.chunks[Number(payload.id)];
      if (!chunk) return;
      this._lastChar = chunk.charOffset + payload.start;
      this.onTimingMode?.("native");   // ranges are always real here
      this.onWord(this._lastChar);
      return;
    }

    if (type === "done") {
      // The queue is finished only when the final chunk reports done.
      if (Number(payload.id) === this.chunks.length - 1 && this.state === "playing") {
        this._setState("idle");
        this.onDone?.();
      }
      return;
    }

    if (type === "error" && this.state === "playing") {
      this._setState("idle");
    }
  }

  speak(chunks, { startIndex = 0 } = {}) {
    this.native.stop();
    this.generation++;
    this.chunks = chunks;
    this._setState("playing");

    // Hand the whole queue to the platform and let it run; the utterance id
    // is the chunk index, which is what maps a range back to its chunk.
    for (let i = startIndex; i < chunks.length; i++) {
      this.native.speak(chunks[i].text, String(i), this.rate);
    }
  }

  /** No native pause exists, so stop and remember where we were. */
  pause() {
    if (this.state !== "playing") return;
    this.native.stop();
    this._setState("paused");
  }

  resume() {
    if (this.state !== "paused") return;
    this._resumeFrom(this._lastChar);
  }

  _resumeFrom(absoluteChar) {
    let ci = this.chunks.findIndex(
      (c) => absoluteChar >= c.charOffset && absoluteChar < c.charOffset + c.text.length
    );
    if (ci < 0) ci = 0;

    const chunk = this.chunks[ci];
    const local = Math.max(0, absoluteChar - chunk.charOffset);

    // Re-queue with the current chunk trimmed to the remembered word, so
    // resuming does not repeat the sentence from its beginning.
    const queue = [
      { text: chunk.text.slice(local), charOffset: chunk.charOffset + local },
      ...this.chunks.slice(ci + 1),
    ];
    this.speak(queue, { startIndex: 0 });
  }

  stop() {
    this.generation++;
    this._lastChar = 0;
    this.native.stop();
    this._setState("idle");
  }

  setRate(rate) {
    this.rate = rate;
    if (this.state === "playing") this._resumeFrom(this._lastChar);
  }

  setVoiceByName(name) {
    try { this.native.setVoice(name); } catch (_) {}
  }

  listVoices() {
    try { return JSON.parse(this.native.voices() || "[]"); } catch (_) { return []; }
  }

  _setState(s) {
    this.state = s;
    this.onStateChange?.(s);
  }
}

/* ------------------------------------------------------------------ *
 * 5. APP
 * ------------------------------------------------------------------ */

const SAMPLE = `The trouble with reading on a screen is that the eye wanders.

A word-synchronised reader solves a narrow but real problem: it gives the eye somewhere to be. As the voice moves through the sentence, the highlight moves with it, and the two together hold attention better than either alone.

Click any word to jump there. Press space to play or pause. Drag the rate slider to change speed — the reader restarts the current sentence, because speech engines will not change rate in the middle of an utterance.

Underneath, the design is deliberately boring. Text is tokenised once, with every word's exact character offset recorded. The speech engine reports its position as a character index; a binary search turns that index back into a word. Everything else — the chunking, the fallbacks, the scrolling — exists to keep those two numbers agreeing with each other.`;

const el = {
  reader: document.getElementById("reader"),
  editor: document.getElementById("editor"),
  play: document.getElementById("btnPlay"),
  stop: document.getElementById("btnStop"),
  edit: document.getElementById("btnEdit"),
  voice: document.getElementById("voice"),
  chapterSelect: document.getElementById("chapterSelect"),
  rate: document.getElementById("rate"),
  rateVal: document.getElementById("rateVal"),
  autoscroll: document.getElementById("autoscroll"),
  clean: document.getElementById("clean"),
  iconPlay: document.getElementById("iconPlay"),
  iconPause: document.getElementById("iconPause"),
  progressFill: document.getElementById("progressFill"),
  timingMode: document.getElementById("timingMode"),
  unsupported: document.getElementById("unsupported"),
  back: document.getElementById("btnBack"),
  fwd: document.getElementById("btnFwd"),
  speedSlider: document.getElementById("speedSlider"),
  seekBar: document.getElementById("seekBar"),
  tElapsed: document.getElementById("tElapsed"),
  tTotal: document.getElementById("tTotal"),
  btnFont: document.getElementById("btnFont"),
  btnClean: document.getElementById("btnClean"),
  btnFollow: document.getElementById("btnFollow"),
};

/* Synthetic speech runs near 2.9 words/sec at rate 1.0. The clock in the
   player is an estimate from word position, not a measured audio duration —
   Web Speech never tells us how long an utterance will actually take. */
const WORDS_PER_SECOND = 2.9;

function fmtTime(seconds) {
  const s = Math.max(0, Math.round(seconds));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function updateProgress(tokenIndex) {
  const total = app.tokens.length || 1;
  const done = Math.max(0, tokenIndex + 1);
  el.progressFill.style.width = `${(done / total) * 100}%`;

  const wps = WORDS_PER_SECOND * (app.engine ? app.engine.rate : 1);
  el.tElapsed.textContent = fmtTime(done / wps);
  el.tTotal.textContent = fmtTime(total / wps);
}

const app = {
  text: "",
  tokens: [],
  chunks: [],
  tokensByChunk: [],
  renderer: new Renderer(el.reader),
  engine: null,

  /** `tree` is a rendered Markdown DOM; without it, text renders flat. */
  load(text, tree = null) {
    if (tree) {
      const built = buildFromDom(tree);
      this.text = built.text;
      this.tokens = built.tokens;
      this.renderer.adopt(tree, built.spans);
    } else {
      this.text = text;
      this.tokens = tokenize(text);
      this.renderer.render(text, this.tokens);
    }

    text = this.text;
    this.chunks = chunkText(text);
    this.tokensByChunk = this.chunks.map(c => {
      const lo = c.charOffset, hi = c.charOffset + c.text.length;
      return this.tokens.filter(t => t.start >= lo && t.start < hi);
    });
    // Reverse index so the chunk holding a word is known in O(1).
    this.chunkOfToken = new Int32Array(this.tokens.length).fill(-1);
    this.tokensByChunk.forEach((toks, ci) => {
      for (const t of toks) this.chunkOfToken[t.index] = ci;
    });

    // Sentences are tracked separately from chunks — see buildSentences.
    const sentences = buildSentences(text, this.tokens);
    this.sentenceOfToken = sentences.ofToken;
    this.sentenceRanges = sentences.ranges;

    if (this.tokens.length === 0) this.renderer.showEmptyNotice();
    updateProgress(-1);
  },

  onWord(absChar) {
    const i = tokenAtChar(this.tokens, absChar);
    if (i < 0) return;

    this.renderer.highlight(i, { scroll: el.autoscroll.checked });

    const range = this.sentenceRanges
      ? this.sentenceRanges[this.sentenceOfToken[i]]
      : null;
    if (range) this.renderer.setSentence(range[0], range[1]);

    updateProgress(i);
  },

  /** Restart playback from an arbitrary word, slicing mid-chunk if needed. */
  seekToToken(tokenIndex) {
    const tok = this.tokens[tokenIndex];
    if (!tok) return;

    let ci = this.chunks.findIndex(
      c => tok.start >= c.charOffset && tok.start < c.charOffset + c.text.length
    );
    if (ci < 0) ci = 0;

    const chunk = this.chunks[ci];
    const localOffset = tok.start - chunk.charOffset;

    // Rebuild the queue with a trimmed first chunk so speech begins on the
    // clicked word rather than the start of its sentence.
    const trimmed = [
      { text: chunk.text.slice(localOffset), charOffset: tok.start },
      ...this.chunks.slice(ci + 1),
    ];
    const trimmedTokens = [
      this.tokens.filter(t => t.start >= tok.start && t.start < chunk.charOffset + chunk.text.length),
      ...this.tokensByChunk.slice(ci + 1),
    ];

    this.renderer.highlight(tokenIndex, { scroll: false });
    this.engine.speak(trimmed, { startIndex: 0, tokensByChunk: trimmedTokens });
  },
};

/* ---- wiring ---- */

function setPlayLabel(state) {
  const playing = state === "playing";
  el.iconPlay.classList.toggle("hidden", playing);
  el.iconPause.classList.toggle("hidden", !playing);

  const label = playing ? "Pause" : state === "paused" ? "Resume" : "Play";
  el.play.title = `${label} (Space)`;
  el.play.setAttribute("aria-label", label);
}

/** Single entry point for play/pause/resume, shared by the button and Space. */
function togglePlayback() {
  if (!app.engine) return;
  const s = app.engine.state;
  if (s === "playing") app.engine.pause();
  else if (s === "paused") app.engine.resume();
  else app.engine.speak(app.chunks, { startIndex: 0, tokensByChunk: app.tokensByChunk });
}

/* Prefer the native engine when running inside the Android app, since the
   WebView has no Web Speech API at all. Everything downstream is identical:
   both classes are producers of the same timing track. */
const Engine =
  AndroidTtsEngine.available ? AndroidTtsEngine :
  WebSpeechEngine.available ? WebSpeechEngine : null;

if (!Engine) {
  el.unsupported.classList.remove("hidden");
  el.play.disabled = true;
  el.stop.disabled = true;
} else {
  app.engine = new Engine({
    onWord: (c) => app.onWord(c),
    onStateChange: setPlayLabel,
    // Surfaced only when the highlight is running on an estimate, because
    // that is the case the reader deserves to know about.
    onTimingMode: (mode) => {
      el.timingMode.classList.toggle("show", mode === "estimated");
    },
    onDone: () => {
      el.progressFill.style.width = "100%";
      el.timingMode.classList.remove("show");
    },
  });

  if (Engine === AndroidTtsEngine) {
    // The bridge reports when the platform engine has finished initialising;
    // asking for voices before that returns nothing.
    const fillAndroidVoices = () => {
      const voices = app.engine.listVoices();
      if (!voices.length) return;
      el.voice.replaceChildren(
        ...voices.map((v) => {
          const o = document.createElement("option");
          o.value = v.name;
          o.textContent = `${v.locale}${v.network ? " (network)" : ""}`;
          return o;
        })
      );
      const local = voices.findIndex((v) => !v.network && /^en/i.test(v.locale));
      el.voice.value = voices[local >= 0 ? local : 0].name;
      app.engine.setVoiceByName(el.voice.value);
    };

    app.engine.onReady = fillAndroidVoices;
    if (window.AndroidTTS.isReady()) fillAndroidVoices();

    el.voice.addEventListener("change", () => {
      app.engine.setVoiceByName(el.voice.value);
    });
  } else {
    // Voices populate asynchronously — the first getVoices() call returns [].
    const loadVoices = () => {
      const voices = speechSynthesis.getVoices();
      if (!voices.length) return;
      el.voice.replaceChildren(
        ...voices.map((v, i) => {
          const o = document.createElement("option");
          o.value = i;
          o.textContent = `${v.name}${v.localService ? "" : " (network)"}`;
          return o;
        })
      );
      const preferred = voices.findIndex(v => v.localService && /^en/i.test(v.lang));
      el.voice.value = preferred >= 0 ? preferred : 0;
      app.engine.voice = voices[el.voice.value];
    };

    loadVoices();
    speechSynthesis.addEventListener("voiceschanged", loadVoices);

    el.voice.addEventListener("change", () => {
      app.engine.voice = speechSynthesis.getVoices()[el.voice.value];
    });
  }

  el.play.addEventListener("click", () => {
    // Drop focus, or the button keeps Space to itself and the global
    // shortcut below would fight with the browser's own activation.
    el.play.blur();
    togglePlayback();
  });

  el.stop.addEventListener("click", () => {
    app.engine.stop();
    app.renderer.clear();
    updateProgress(-1);
    el.timingMode.classList.remove("show");
  });

  el.rate.addEventListener("input", () => {
    const r = parseFloat(el.rate.value);
    el.rateVal.textContent = `${+r.toFixed(2)}×`;
    app.engine.setRate(r);
    updateProgress(app.renderer.active);   // rate changes the time estimate
    syncSpeedSlider();
    renderDial();
  });

  el.reader.addEventListener("click", (e) => {
    const span = e.target.closest(".w");
    if (span) app.seekToToken(parseInt(span.dataset.i, 10));
  });

  document.addEventListener("keydown", (e) => {
    if (e.code !== "Space" || e.repeat) return;
    if (e.ctrlKey || e.altKey || e.metaKey) return;

    // Leave Space alone wherever it already means something: typing in the
    // editor, toggling a checkbox, opening a select.
    const a = document.activeElement;
    if (a && (a.isContentEditable || ["TEXTAREA", "INPUT", "SELECT"].includes(a.tagName))) return;

    e.preventDefault();     // also stops the page scrolling
    togglePlayback();
  });
}

el.edit.addEventListener("click", () => {
  const editing = !el.editor.classList.contains("hidden");
  if (editing) {
    loadRaw(el.editor.value, "edited text");
    el.editor.classList.add("hidden");
    el.reader.classList.remove("hidden");
    el.edit.textContent = "Edit text";
  } else {
    // Show the untouched source, not the cleaned rendering — otherwise
    // editing would silently bake the stripping into the text.
    el.editor.value = app.raw ? app.raw.text : app.text;
    el.editor.classList.remove("hidden");
    el.reader.classList.add("hidden");
    el.edit.textContent = "Done";
  }
});

el.clean.addEventListener("change", () => {

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cadence.tts'
    compileSdk 35

    defaultConfig {
        applicationId "com.cadence.tts"
        // onRangeStart, which reports word boundaries, landed in API 26.
        // Without it there is no timing track and no word highlighting.
        minSdk 26
        targetSdk 35
        // Overridable from the command line for tagged releases, e.g.
        // -PAPP_VERSION_CODE=12 -PAPP_VERSION_NAME=1.2.0 — see
        // .github/workflows/release.yml. Plain local builds get 1 / "1.0".
        versionCode (project.hasProperty('APP_VERSION_CODE') ? (APP_VERSION_CODE as int) : 1)
        versionName (project.hasProperty('APP_VERSION_NAME') ? APP_VERSION_NAME : "1.0")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

/*
 * No dependencies. MainActivity uses the framework's own WindowInsets
 * (API 30+, with a deprecated-accessor fallback below that) instead of
 * androidx.core, so the project needs nothing beyond the platform SDK.
 */

/*
 * The web app has exactly one source of truth: ../index.html at the repo
 * root. Copying it in at build time means the APK can never drift from the
 * browser version, which is the usual failure mode for wrapped web apps.
 */
tasks.register('syncWebApp', Copy) {
    from rootProject.file('../index.html')
    into layout.projectDirectory.dir('src/main/assets')
}

tasks.named('preBuild') {
    dependsOn 'syncWebApp'
}
